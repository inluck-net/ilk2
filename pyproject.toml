[project]
name = "ilk2"
version = "0.3.0"
description = "Small execution core for multi-step coding batches on a Mac (ilk V2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ilk2 = "ilk2.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6"]
spike = [
    "claude-agent-sdk>=0.2.165",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilk2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
