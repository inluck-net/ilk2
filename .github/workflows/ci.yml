name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync (Python 3.12, locked)
        run: uv sync --locked --python 3.12
      - name: Tests
        run: uv run pytest -q
