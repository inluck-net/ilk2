name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync (Python 3.12, locked)
        run: uv sync --locked --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vitest caches 3.2.4 and 4.1.11 for S20/S21 (tests/test_vitest.py)
        run: |
          # Locked trees, installed as locked (Oct 16: npm 10.8 crashed resolving vitest 4's optional
          # browser peers with 'edgesOut' on a fresh resolve; the peers are not needed here).
          mkdir -p ~/.cache/ilk2-test-vitest
          cp tests/fixtures/vitest-cache/package.json tests/fixtures/vitest-cache/package-lock.json ~/.cache/ilk2-test-vitest/
          npm ci --prefix ~/.cache/ilk2-test-vitest --no-audit --no-fund --legacy-peer-deps
          mkdir -p ~/.cache/ilk2-test-vitest4
          cp tests/fixtures/vitest4-cache/package.json tests/fixtures/vitest4-cache/package-lock.json ~/.cache/ilk2-test-vitest4/
          npm ci --prefix ~/.cache/ilk2-test-vitest4 --no-audit --no-fund --legacy-peer-deps
      - name: Tests
        env:
          ILK2_REQUIRE_VITEST: "1"
        run: uv run pytest -q -rs
      - name: Core size per module (diagnostic, docs/02 §2.12)
        run: uv run python tools/size.py
